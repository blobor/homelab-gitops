# Public repo: block plaintext secrets before they are committed.
# Setup once per clone: pre-commit install
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: sops-encrypted
        name: "*.sops.yaml must be encrypted"
        entry: bash -c 'rc=0; for f in "$@"; do grep -q "^sops:" "$f" || { echo "NOT ENCRYPTED - $f"; rc=1; }; done; exit $rc' --
        language: system
        files: \.sops\.ya?ml$
        exclude: ^\.sops\.yaml$
