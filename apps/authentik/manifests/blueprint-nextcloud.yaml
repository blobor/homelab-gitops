apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-nextcloud
data:
  nextcloud.yaml: |
    version: 1
    metadata:
      name: nextcloud
    entries:
      # Nextcloud finds an account by the username. Never rename a member, and never give a used name to another person.
      - model: authentik_core.group
        id: group
        identifiers: {name: nextcloud-users}
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers: {name: nextcloud}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: nextcloud
          client_secret: !Env NEXTCLOUD_OAUTH_CLIENT_SECRET
          grant_types: [authorization_code, refresh_token]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # No post-logout redirect URI: with one, authentik demands an id_token_hint, which user_oidc sends only with --send-id-token-hint=1.
          redirect_uris:
            - {matching_mode: strict, url: "https://drive.private.home.lobor.dev/apps/user_oidc/code"}
            # in case the rewrite block of .htaccess is ever missing
            - {matching_mode: strict, url: "https://drive.private.home.lobor.dev/index.php/apps/user_oidc/code"}
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: application
        identifiers: {slug: nextcloud}
        attrs:
          name: Nextcloud
          provider: !KeyOf provider
          meta_launch_url: https://drive.private.home.lobor.dev
      # Only group members can log in.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf application
          group: !KeyOf group
        attrs:
          order: 0
