apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610050823-standard-trixie
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  storage:
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
