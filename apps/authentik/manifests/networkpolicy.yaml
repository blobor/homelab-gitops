# The operator needs the status port for updates and failover. Instances of one cluster need each other for replication and the isolation check.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-db
spec:
  endpointSelector:
    matchLabels: {cnpg.io/cluster: authentik-db}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: authentik}
        - matchLabels: {app: authentik-backup}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels: {cnpg.io/cluster: authentik-db}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}, {port: "8000", protocol: TCP}]
