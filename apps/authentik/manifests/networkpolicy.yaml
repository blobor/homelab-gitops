# The operator needs the status port for updates and failover. Instances of one cluster need each other for replication and the isolation check.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-db
spec:
  endpointSelector:
    matchLabels: {cnpg.io/cluster: authentik-db}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: authentik}
        - matchLabels: {app: authentik-backup}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels: {cnpg.io/cluster: authentik-db}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}, {port: "8000", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  enableDefaultDeny: {ingress: false}   # observation only: nothing is blocked yet
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/instance: traefik-internal-traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/instance: traefik-public-traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: glance
            app: glance
      toPorts:
        - ports: [{port: "9000", protocol: TCP}]
---
# An empty rule in a CiliumNetworkPolicy denies all ingress. In a Kubernetes NetworkPolicy the same text allows all.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-worker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: worker
  enableDefaultDeny: {ingress: false}   # observation only: nothing is blocked yet
  ingress:
    - {}
