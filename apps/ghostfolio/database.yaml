apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ghostfolio-db
spec:
  instances: 1
  smartShutdownTimeout: 15        # clients with connection pools never disconnect; then fast shutdown
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-standard-trixie
  bootstrap:
    initdb:
      database: ghostfolio
      owner: ghostfolio
  storage:
    size: 2Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
