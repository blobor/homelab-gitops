apiVersion: v1
kind: Service
metadata:
  name: ghostfolio
spec:
  selector: {app: ghostfolio}
  ports:
    - {name: web, port: 3333, targetPort: web}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghostfolio
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [money.private.home.lobor.dev]
  rules:
    - host: money.private.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ghostfolio, port: {name: web}}}}
