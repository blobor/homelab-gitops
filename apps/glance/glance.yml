server:
  port: 8080

theme:
  background-color: 225 14 15
  primary-color: 157 47 65
  contrast-multiplier: 1.1

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Europe/Kyiv
                label: Kyiv
          - type: weather
            location: Kyiv, Ukraine
            units: metric
            hour-format: 24h
          - type: custom-api
            title: НБУ
            cache: 1h
            url: https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json
            template: |
              <ul class="list list-gap-10">
                {{ range .JSON.Array "" }}{{ if or (eq (.String "cc") "USD") (eq (.String "cc") "EUR") }}
                <li class="flex justify-between">
                  <span class="color-highlight">{{ .String "cc" }}</span>
                  <span>{{ .Float "rate" | printf "%.2f" }}</span>
                </li>
                {{ end }}{{ end }}
              </ul>

          - type: custom-api
            title: monobank
            cache: 30m
            url: https://api.monobank.ua/bank/currency
            template: |
              <ul class="list list-gap-10">
                {{ range .JSON.Array "" }}{{ if and (eq (.Int "currencyCodeB") 980) (or (eq (.Int "currencyCodeA") 840) (eq (.Int "currencyCodeA") 978)) }}
                <li class="flex justify-between">
                  <span class="color-highlight">{{ if eq (.Int "currencyCodeA") 840 }}USD{{ else }}EUR{{ end }}</span>
                  <span>{{ .Float "rateBuy" | printf "%.2f" }} <span class="color-subdue">/</span> {{ .Float "rateSell" | printf "%.2f" }}</span>
                </li>
                {{ end }}{{ end }}
              </ul>

      - size: full
        widgets:
          - type: monitor
            title: Services
            cache: 1m
            sites:
              - title: Plex
                url: https://app.plex.tv/desktop/
                check-url: https://plex.plex.svc.cluster.local:32400/identity
                allow-insecure: true
                icon: si:plex
              - title: Immich
                url: https://photos.home.lobor.dev
                check-url: http://immich-server.immich.svc.cluster.local:2283/api/server/ping
                icon: si:immich
              - title: Home Assistant
                url: https://ha.private.home.lobor.dev
                check-url: http://home-assistant.tailnet-backends.svc.cluster.local:8123
                icon: si:homeassistant
              - title: Syncthing
                url: https://sync.private.home.lobor.dev
                check-url: http://syncthing-gui.syncthing.svc.cluster.local:8384/rest/noauth/health
                icon: si:syncthing
              - title: Proxmox
                url: https://bender.private.home.lobor.dev
                check-url: https://proxmox.tailnet-backends.svc.cluster.local:8006
                allow-insecure: true
                icon: si:proxmox
              - title: UniFi
                url: https://unifi.private.home.lobor.dev
                check-url: https://unifi-ui.unifi.svc.cluster.local:8443/status
                allow-insecure: true
                icon: si:ubiquiti
              - title: Grafana
                url: https://grafana.private.home.lobor.dev
                check-url: http://vm-grafana.monitoring.svc.cluster.local/api/health
                icon: si:grafana
              - title: ArgoCD
                url: https://argo.private.home.lobor.dev
                check-url: http://argocd-server.argocd.svc.cluster.local/healthz
                icon: si:argo

          - type: custom-api
            title: NAS · Loki
            cache: 5m
            url: http://vmsingle-vm.monitoring.svc.cluster.local:8428/api/v1/query
            parameters:
              query: >-
                sort_by_label(union(
                  label_set(round(100 * (1 - raidFreeSize{job="synology",raidName="Volume 1"} / raidTotalSize{job="synology",raidName="Volume 1"})), "n", "1", "item", "Зайнято", "unit", "%"),
                  label_set(round(raidFreeSize{job="synology",raidName="Volume 1"} / 1e12, 0.1), "n", "2", "item", "Вільно", "unit", " TB"),
                  label_set(round(raidTotalSize{job="synology",raidName="Volume 1"} / 1e12, 0.1), "n", "3", "item", "Всього", "unit", " TB"),
                  label_set(max(diskTemperature{job="synology"}), "n", "4", "item", "Темп. дисків (макс.)", "unit", " °C"),
                  label_set(temperature{job="synology"}, "n", "5", "item", "Темп. системи", "unit", " °C"),
                  label_set(max({__name__=~"systemStatus|powerStatus|systemFanStatus|cpuFanStatus", job="synology"}) == 1, "n", "6", "item", "Система", "text", "OK"),
                  label_set(max({__name__=~"systemStatus|powerStatus|systemFanStatus|cpuFanStatus", job="synology"}) != 1, "n", "6", "item", "Система", "text", "Збій", "class", "color-negative"),
                  label_set(max(raidStatus{job="synology"}) == 1, "n", "7", "item", "RAID", "text", "OK"),
                  label_set(max(raidStatus{job="synology"}) != 1, "n", "7", "item", "RAID", "text", "Збій", "class", "color-negative"),
                  label_set(max(diskStatus{job="synology"}) == 1, "n", "8", "item", "Диски", "text", "OK"),
                  label_set(max(diskStatus{job="synology"}) != 1, "n", "8", "item", "Диски", "text", "Збій", "class", "color-negative")
                ), "n")
            template: |
              <ul class="list list-gap-10">
                {{ range .JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span>{{ .String "metric.item" }}</span>
                  <span class="{{ with .String "metric.class" }}{{ . }}{{ else }}color-highlight{{ end }}">{{ with .String "metric.text" }}{{ . }}{{ else }}{{ .String "value.1" }}{{ .String "metric.unit" }}{{ end }}</span>
                </li>
                {{ end }}
              </ul>

          - type: bookmarks
            groups:
              - title: Homelab
                links:
                  - title: Synology DSM
                    url: https://loki.hippo-lake.ts.net
                  - title: MikroTik
                    url: http://10.20.30.1
                  - title: GitOps repo
                    url: https://github.com/blobor/homelab-gitops
              - title: Cloud
                links:
                  - title: Tailscale
                    url: https://login.tailscale.com/admin/machines
                  - title: Cloudflare
                    url: https://dash.cloudflare.com
                  - title: healthchecks.io
                    url: https://healthchecks.io/projects/
