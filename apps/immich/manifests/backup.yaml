apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-backups-immich
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, noatime]
  nfs:
    server: 10.20.30.200
    path: /volume1/k8s-backups
  claimRef:
    namespace: immich
    name: k8s-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: k8s-backups-immich
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump
spec:
  schedule: "45 2 * * *"
  timeZone: Europe/Kyiv
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6-202610050823-standard-trixie
              command: [sh, -c, 'pg_dump -Fc -f /work/immich.dump']
              env:
                - {name: PGHOST, value: immich-db-rw}
                - {name: PGDATABASE, value: immich}
                - name: PGUSER
                  valueFrom: {secretKeyRef: {name: immich-db-app, key: username}}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: immich-db-app, key: password}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: work, mountPath: /work}
          containers:
            - name: store
              image: busybox:1.37
              command:
                - sh
                - -c
                - |
                  set -eu
                  mkdir -p /backup/postgres/immich
                  cp /work/immich.dump "/backup/postgres/immich/immich-$(date +%F-%H%M).dump"
                  ls -1t /backup/postgres/immich/immich-*.dump | tail -n +15 | xargs -r rm -f
                  ls -lh /backup/postgres/immich
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: backup, mountPath: /backup}
          volumes:
            - {name: work, emptyDir: {}}
            - {name: backup, persistentVolumeClaim: {claimName: k8s-backups}}
