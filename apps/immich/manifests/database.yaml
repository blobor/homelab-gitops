apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
spec:
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  smartShutdownTimeout: 15        # clients with connection pools never disconnect; then fast shutdown
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1
  postgresql:
    shared_preload_libraries: [vchord.so]
    parameters:
      max_slot_wal_keep_size: 2GB   # a replica that is down cannot fill the primary's volume
    synchronous:
      method: any
      number: 1
      dataDurability: preferred     # with one instance down, writes go on without a sync standby
  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
  storage:
    storageClass: local
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}
