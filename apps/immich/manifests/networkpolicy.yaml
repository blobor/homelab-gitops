# The operator needs the status port for updates and failover. Instances of one cluster need each other for replication and the isolation check.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-db
spec:
  endpointSelector:
    matchLabels: {cnpg.io/cluster: immich-db}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: server, app.kubernetes.io/instance: immich}
        - matchLabels: {app: immich-backup}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
        - matchLabels: {cnpg.io/cluster: immich-db}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}, {port: "8000", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-valkey
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: valkey, app.kubernetes.io/instance: immich}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: server, app.kubernetes.io/instance: immich}
      toPorts:
        - ports: [{port: "6379", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: immich
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/instance: traefik-internal-traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/instance: traefik-public-traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: glance
            app: glance
      toPorts:
        - ports: [{port: "2283", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-machine-learning
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: machine-learning
      app.kubernetes.io/instance: immich
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: server
            app.kubernetes.io/instance: immich
      toPorts:
        - ports: [{port: "3003", protocol: TCP}]
