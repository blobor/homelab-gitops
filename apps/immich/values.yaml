controllers:
  main:
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
    containers:
      main:
        image:
          tag: v3.3.1
        env:
          TZ: Europe/Kyiv

immich:
  persistence:
    library:
      existingClaim: immich-library
  existingConfiguration: immich-config
  configurationKind: Secret

valkey:
  enabled: true
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999

server:
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          env:
            DB_HOSTNAME: immich-db-rw
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              valueFrom: {secretKeyRef: {name: immich-db-app, key: username}}
            DB_PASSWORD:
              valueFrom: {secretKeyRef: {name: immich-db-app, key: password}}
          resources:
            requests: {cpu: 200m, memory: 2Gi}
            limits: {memory: 8Gi, gpu.intel.com/i915: "1"}   # QSV video transcoding
  persistence:
    generated:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-generated
      globalMounts:
        - {path: /data/thumbs, subPath: thumbs}
        - {path: /data/encoded-video, subPath: encoded-video}
  ingress:
    main:
      enabled: true
      className: traefik-internal
      hosts:
        - host: photos.private.home.lobor.dev
          paths:
            - path: /
              service: {identifier: main}
      tls:
        - hosts: [photos.private.home.lobor.dev]

machine-learning:
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          image:
            tag: v3.3.1-openvino
          probes:
            liveness:
              spec:
                timeoutSeconds: 5
                failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 3Gi}
            limits: {memory: 12Gi, gpu.intel.com/i915: "1"}
  persistence:
    cache:
      type: persistentVolumeClaim
      existingClaim: immich-ml-cache
