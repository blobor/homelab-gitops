# Read-only: the built-in view role (no Secrets, no exec, includes metrics.k8s.io) plus nodes.
# With no create/exec rights, the Kite web terminals cannot start.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite-view
subjects:
  - {kind: ServiceAccount, name: kite, namespace: kite}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kite-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite-nodes
subjects:
  - {kind: ServiceAccount, name: kite, namespace: kite}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kite-nodes
