# Read-only Kubernetes UI for the phone. Tailnet/LAN only (traefik-internal), login through Authentik.
# The real boundary is the ServiceAccount RBAC in manifests/rbac.yaml (view + nodes): Kite runs
# every request with that one ServiceAccount, and its own RBAC sits on top.
fullnameOverride: kite

host: https://k8s.private.home.lobor.dev     # for the OAuth redirect URL

# JWT_SECRET, KITE_ENCRYPT_KEY, OAUTH_CLIENT_SECRET, SUPERUSER_PASSWORD (SOPS, manifests/).
secret:
  create: false
  existingSecret: kite-secrets

rbac:
  create: false               # the chart default is cluster-admin; see manifests/rbac.yaml

serviceAccount:
  name: kite

# SQLite on an emptyDir: all settings come from the config below, the DB holds only sessions and audit logs.
db:
  type: sqlite

# Applied on every start; these sections are read-only in the UI. ${VAR} comes from kite-secrets.
config:
  enabled: true
  # A user must exist, else the setup wizard lets anyone create an admin. Nobody logs in with it.
  superUser:
    username: kite-admin
    password: ${SUPERUSER_PASSWORD}
  clusters:
    - name: springfield
      inCluster: true
      default: true
      prometheusURL: http://vmsingle.monitoring.svc.cluster.local:8428
  oauth:
    - name: authentik
      clientId: kite
      clientSecret: ${OAUTH_CLIENT_SECRET}
      issuer: https://auth.home.lobor.dev/application/o/kite/
      scopes: openid,profile,email
      usernameClaim: preferred_username
      groupsClaim: groups
      allowedGroups: kubernetes-viewers
      enabled: true
  rbac:
    roles:
      - name: viewer
        description: Read-only access
        clusters: ["*"]
        namespaces: ["*"]
        resources: ["*"]
        verbs: [get, log]
    roleMapping:
      - name: viewer
        oidcGroups: [kubernetes-viewers]

extraEnvs:
  - {name: HOME, value: /tmp}               # read-only root filesystem
  - {name: DISABLE_VERSION_CHECK, value: "true"}   # Renovate tracks the version

ingress:
  enabled: true
  className: traefik-internal
  hosts:
    - host: k8s.private.home.lobor.dev
      paths:
        - {path: /, pathType: Prefix}
  tls:
    - hosts: [k8s.private.home.lobor.dev]   # wildcard certificate from the Traefik TLSStore

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 256Mi}

volumes:
  - {name: tmp, emptyDir: {}}
volumeMounts:
  - {name: tmp, mountPath: /tmp}
