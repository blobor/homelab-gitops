apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-backups-nextcloud
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, noatime]
  nfs:
    server: 10.20.30.200
    path: /volume1/k8s-backups
  claimRef:
    namespace: nextcloud
    name: k8s-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: k8s-backups-nextcloud
  resources:
    requests:
      storage: 20Gi
---
# One run makes one folder. The dump and the archive in it are a pair: config.php in the archive has the keys
# for the encrypted values in the dump. The user files are not here: the NAS share of the data has snapshots.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "40 2 * * *"
  timeZone: Europe/Kyiv
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800   # a job that hangs on the hard NFS mount would block all later runs
      template:
        metadata:
          labels: {app: nextcloud-backup}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          enableServiceLinks: false
          affinity:
            podAffinity:                  # the html volume is ReadWriteOnce: run on the node of Nextcloud
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels: {app: nextcloud}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.7-202611230809-standard-trixie
              command: [sh, -c, 'pg_dump -Fc -f /work/nextcloud.dump && pg_restore --list /work/nextcloud.dump >/dev/null']
              env:
                - {name: PGHOST, value: nextcloud-db-rw}
                - {name: PGDATABASE, value: nextcloud}
                - name: PGUSER
                  valueFrom: {secretKeyRef: {name: nextcloud-db-app, key: username}}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: nextcloud-db-app, key: password}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: work, mountPath: /work}
            - name: state
              image: nextcloud:35.0.3-apache   # for PHP: it takes the lock that Nextcloud uses, and it checks the copy
              command:
                - sh
                - -c
                - |
                  set -eu
                  cd /var/www/html
                  # Nextcloud rewrites config.php in place under an exclusive lock. Without the shared lock the archive can hold half of the file.
                  php -r '$f = fopen("config/config.php", "r"); flock($f, LOCK_SH) || exit(1); passthru("tar -czf /work/nextcloud-state.tar.gz config custom_apps themes version.php", $rc); exit($rc);'
                  rm -rf /work/check
                  mkdir /work/check
                  tar -xzf /work/nextcloud-state.tar.gz -C /work/check config/config.php
                  # No output: a parse error of PHP would print a part of the file.
                  php -r 'include "/work/check/config/config.php"; $c = $CONFIG ?? []; exit(($c["installed"] ?? false) === true && empty($c["maintenance"]) && !empty($c["instanceid"]) && !empty($c["secret"]) && !empty($c["passwordsalt"]) ? 0 : 1);' >/dev/null 2>&1 \
                    || { echo "config.php in the archive is damaged, in maintenance mode, or not of an installed instance"; exit 1; }
                  rm -rf /work/check
              securityContext:
                runAsUser: 33               # config.php is readable only by the user of Nextcloud
                runAsGroup: 33
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: html, mountPath: /var/www/html, readOnly: true}
                - {name: work, mountPath: /work}
          containers:
            - name: store
              image: busybox:1.38
              command:
                - sh
                - -c
                - |
                  set -eu
                  dir=/backup/nextcloud
                  ts=$(date -u +%Y%m%dT%H%MZ)
                  [ ! -e "$dir/$ts" ] || { echo "the folder $ts exists: a second run in the same minute"; exit 1; }
                  mkdir -p "$dir"
                  mkdir "$dir/.$ts"
                  cp /work/nextcloud.dump /work/nextcloud-state.tar.gz "$dir/.$ts/"
                  (cd /work && sha256sum nextcloud.dump nextcloud-state.tar.gz) >"$dir/.$ts/SHA256SUMS"   # of the source, so a bad copy shows
                  mv "$dir/.$ts" "$dir/$ts"
                  ls -1d "$dir"/20* | sort -r | tail -n +15 | xargs -r rm -rf
                  find "$dir" -maxdepth 1 -type d -name '.20*' -mmin +1440 -exec rm -rf {} +   # what a failed run left
                  ls -l "$dir/$ts"
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: backup, mountPath: /backup}
          volumes:
            - {name: html, persistentVolumeClaim: {claimName: nextcloud-html, readOnly: true}}
            - {name: work, emptyDir: {}}
            - {name: backup, persistentVolumeClaim: {claimName: k8s-backups}}
