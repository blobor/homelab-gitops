apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud
resources:
  - database.yaml
  - valkey.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: nextcloud-hooks
    files:
      - hooks/10-cluster-config.sh
      - hooks/20-app-settings.sh
      - hooks/cluster.config.php
  - name: nextcloud-apache
    files:
      - apache/zz-cluster.conf
