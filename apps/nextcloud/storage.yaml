apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, noatime]
  nfs:
    server: 10.20.30.200
    path: /volume1/nextcloud
  claimRef:
    namespace: nextcloud
    name: nextcloud-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: nextcloud-data
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
