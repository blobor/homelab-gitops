apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-backups-paperless
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, noatime]
  nfs:
    server: 10.20.30.200
    path: /volume1/k8s-backups
  claimRef:
    namespace: paperless
    name: k8s-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: k8s-backups-paperless
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-dump
spec:
  schedule: "50 2 * * *"
  timeZone: Europe/Kyiv
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800   # a job that hangs on the hard NFS mount would block all later runs
      template:
        metadata:
          labels: {app: paperless-backup}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.7-202611201711-standard-trixie
              command: [sh, -c, 'pg_dump -Fc -f /work/paperless.dump']
              env:
                - {name: PGHOST, value: paperless-db-rw}
                - {name: PGDATABASE, value: paperless}
                - name: PGUSER
                  valueFrom: {secretKeyRef: {name: paperless-db-app, key: username}}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: paperless-db-app, key: password}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: work, mountPath: /work}
          containers:
            - name: store
              image: busybox:1.38
              command:
                - sh
                - -c
                - |
                  set -eu
                  mkdir -p /backup/postgres/paperless
                  cp /work/paperless.dump "/backup/postgres/paperless/paperless-$(date +%F-%H%M).dump"
                  ls -1t /backup/postgres/paperless/paperless-*.dump | tail -n +15 | xargs -r rm -f
                  ls -lh /backup/postgres/paperless
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: backup, mountPath: /backup}
          volumes:
            - {name: work, emptyDir: {}}
            - {name: backup, persistentVolumeClaim: {claimName: k8s-backups}}
