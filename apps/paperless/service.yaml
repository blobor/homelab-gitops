apiVersion: v1
kind: Service
metadata:
  name: paperless
spec:
  selector: {app: paperless}
  ports:
    - {name: web, port: 8000, targetPort: web}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [paper.private.home.lobor.dev]
  rules:
    - host: paper.private.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: paperless, port: {name: web}}}}
