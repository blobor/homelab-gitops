apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
spec:
  replicas: 1
  strategy:
    type: Recreate                  # RWO config volume
  selector:
    matchLabels: {app: plex}
  template:
    metadata:
      labels: {app: plex}
    spec:
      hostname: plex                # server name if FriendlyName is unset
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.5.11079-b3b13e506
          env:
            - {name: TZ, value: Europe/Kyiv}
            - {name: PLEX_UID, value: "999"}     # owner of the config files
            - {name: PLEX_GID, value: "65537"}   # group media-ro on Loki: read access to the media share
            - {name: ADVERTISE_IP, value: "https://10.20.8.242:32400/"}
          ports:
            - {name: pms, containerPort: 32400, protocol: TCP}
          readinessProbe:
            httpGet: {path: /identity, port: pms, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /identity, port: pms, scheme: HTTPS}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 8Gi, gpu.intel.com/i915: "1"}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: transcode, mountPath: /transcode}
            - {name: media, mountPath: /mnt/movies, subPath: movies, readOnly: true}
            - {name: media, mountPath: /mnt/tv_shows, subPath: tv_shows, readOnly: true}
            - {name: media, mountPath: /mnt/music, subPath: music, readOnly: true}
            - {name: media, mountPath: /mnt/music_video, subPath: music_video, readOnly: true}
      volumes:
        - {name: config, persistentVolumeClaim: {claimName: plex-config}}
        - {name: transcode, emptyDir: {sizeLimit: 30Gi}}
        - {name: media, persistentVolumeClaim: {claimName: media, readOnly: true}}
