# Media shares on Loki, read-only (same paths as in the old LXC: /mnt/<share>).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media-movies
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, noatime]
  nfs:
    server: 10.20.30.200
    path: /volume1/movies
    readOnly: true
  claimRef:
    namespace: plex
    name: media-movies
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-movies
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: plex-media-movies
  resources:
    requests:
      storage: 1Ti
---
