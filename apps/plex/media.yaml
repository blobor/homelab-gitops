# Media share on Loki, read-only. Each library folder is mounted with subPath
# at /mnt/<folder>: the folder paths of the Plex libraries.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, noatime]
  nfs:
    server: 10.20.30.200
    path: /volume1/media
    readOnly: true
  claimRef:
    namespace: plex
    name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: plex-media
  resources:
    requests:
      storage: 1Ti
