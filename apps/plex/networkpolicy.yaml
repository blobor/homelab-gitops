apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex
spec:
  endpointSelector:
    matchLabels: {app: plex}
  enableDefaultDeny: {ingress: false}   # observation only: nothing is blocked yet
  ingress:
    - fromEntities: [world]
      toPorts:
        - ports: [{port: "32400", protocol: TCP}]
    # A pod that uses the LoadBalancer address keeps its pod identity, so world does not cover it.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: glance
            app: glance
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seerr
            app: seerr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: sonarr
            app: sonarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: radarr
            app: radarr
      toPorts:
        - ports: [{port: "32400", protocol: TCP}]
