apiVersion: v1
kind: Service
metadata:
  name: prowlarr
spec:
  selector: {app: prowlarr}
  ports:
    - {name: web, port: 9696, targetPort: web}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [prowlarr.private.home.lobor.dev]
  rules:
    - host: prowlarr.private.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: prowlarr, port: {name: web}}}}
