apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: seerr}
  template:
    metadata:
      labels: {app: seerr}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.1
          env:
            - {name: TZ, value: Europe/Kyiv}
            - {name: LOG_LEVEL, value: info}
          ports:
            - {name: web, containerPort: 5055}
          readinessProbe:
            httpGet: {path: /api/v1/status/appdata, port: web}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/status/appdata, port: web}
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /app/config}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: seerr-config}
