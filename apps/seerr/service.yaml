apiVersion: v1
kind: Service
metadata:
  name: seerr
spec:
  selector: {app: seerr}
  ports:
    - {name: web, port: 5055, targetPort: web}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [seerr.private.home.lobor.dev]
  rules:
    - host: seerr.private.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: seerr, port: {name: web}}}}
