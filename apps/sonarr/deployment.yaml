apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: sonarr}
  template:
    metadata:
      labels: {app: sonarr}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls2
          env:
            - {name: TZ, value: Europe/Kyiv}
            - {name: PUID, value: "1031"}           # user arr on Loki, as in Transmission
            - {name: PGID, value: "65538"}          # group media-rw on Loki: write access to media
            - {name: SONARR__AUTH__METHOD, value: Forms}
            - {name: SONARR__AUTH__REQUIRED, value: Enabled}   # requests come from Traefik, a local address
          ports:
            - {name: web, containerPort: 8989}
          readinessProbe:
            httpGet: {path: /ping, port: web}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: web}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /data}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: sonarr-config}
        - name: media
          persistentVolumeClaim: {claimName: media}
