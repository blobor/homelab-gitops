apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sonarr
spec:
  endpointSelector:
    matchLabels: {app: sonarr}
  enableDefaultDeny: {ingress: false}   # observation only: nothing is blocked yet
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/instance: traefik-internal-traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: glance
            app: glance
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seerr
            app: seerr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prowlarr
            app: prowlarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: recyclarr
            app: recyclarr
      toPorts:
        - ports: [{port: "8989", protocol: TCP}]
