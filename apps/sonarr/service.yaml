apiVersion: v1
kind: Service
metadata:
  name: sonarr
spec:
  selector: {app: sonarr}
  ports:
    - {name: web, port: 8989, targetPort: web}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [sonarr.private.home.lobor.dev]
  rules:
    - host: sonarr.private.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: sonarr, port: {name: web}}}}
