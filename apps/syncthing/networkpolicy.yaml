apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: syncthing
spec:
  endpointSelector:
    matchLabels: {app: syncthing}
  enableDefaultDeny: {ingress: false}   # observation only: nothing is blocked yet
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/instance: traefik-internal-traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: glance
            app: glance
      toPorts:
        - ports: [{port: "8384", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
            tailscale.com/parent-resource: syncthing
            tailscale.com/parent-resource-ns: syncthing
      toPorts:
        - ports: [{port: "22000", protocol: TCP}, {port: "22000", protocol: UDP}]
