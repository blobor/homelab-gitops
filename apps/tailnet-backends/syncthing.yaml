# sync.private.home.lobor.dev → Traefik internal → Tailscale egress proxy → syncthing:8384 (tailnet device outside the cluster).
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  annotations:
    tailscale.com/tailnet-fqdn: syncthing.hippo-lake.ts.net
    tailscale.com/tags: tag:springfield-egress
spec:
  type: ExternalName
  externalName: placeholder              # rewritten by the Tailscale operator to its egress proxy
  ports:
    - {name: web, port: 8384, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncthing
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [sync.private.home.lobor.dev]
  rules:
    - host: sync.private.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: syncthing, port: {name: web}}}}
