apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ovms
spec:
  endpointSelector:
    matchLabels: {app: ovms}
  enableDefaultDeny: {ingress: false}   # observation only: nothing is blocked yet
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/instance: traefik-internal-traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-gateway
            app.kubernetes.io/name: agentgateway-standalone
            app.kubernetes.io/instance: agent-gateway
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
