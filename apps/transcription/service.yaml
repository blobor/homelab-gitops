apiVersion: v1
kind: Service
metadata:
  name: ovms
spec:
  selector: {app: ovms}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ovms
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [transcribe.private.home.lobor.dev]
  rules:
    - host: transcribe.private.home.lobor.dev
      http:
        # Only these paths: the OVMS API key does not protect /v1/config, /v2 or /metrics.
        paths:
          - {path: /v1/audio, pathType: Prefix, backend: {service: {name: ovms, port: {name: http}}}}
          - {path: /v1/models, pathType: Prefix, backend: {service: {name: ovms, port: {name: http}}}}
