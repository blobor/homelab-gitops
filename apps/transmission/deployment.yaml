apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: transmission}
  template:
    metadata:
      labels: {app: transmission}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: transmission
          image: lscr.io/linuxserver/transmission:4.1.4-r0-ls367
          env:
            - {name: TZ, value: Europe/Kyiv}
            - {name: PUID, value: "1031"}           # user arr on Loki: write access to bucket
            - {name: PGID, value: "65538"}          # group media-rw on Loki: write access to media
            - {name: PEERPORT, value: "51413"}
            - {name: HOST_WHITELIST, value: dl.private.home.lobor.dev}
            - name: USER
              valueFrom: {secretKeyRef: {name: transmission-rpc, key: USER}}
            - name: PASS
              valueFrom: {secretKeyRef: {name: transmission-rpc, key: PASS}}
          ports:
            - {name: web, containerPort: 9091}
            - {name: peer-tcp, containerPort: 51413, protocol: TCP}
            - {name: peer-udp, containerPort: 51413, protocol: UDP}
          readinessProbe:
            tcpSocket: {port: web}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: web}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: bucket, mountPath: /downloads, subPath: downloads}
            - {name: bucket, mountPath: /watch, subPath: downloads/watch}
            - {name: media, mountPath: /data/downloads, subPath: downloads}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: transmission-config}
        - name: bucket
          persistentVolumeClaim: {claimName: bucket}
        - name: media
          persistentVolumeClaim: {claimName: media}
