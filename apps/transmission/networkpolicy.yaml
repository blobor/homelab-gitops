apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: transmission
spec:
  endpointSelector:
    matchLabels: {app: transmission}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/instance: traefik-internal-traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: glance
            app: glance
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: sonarr
            app: sonarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: radarr
            app: radarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: transmission
            app: transmission-cleanup
      toPorts:
        - ports: [{port: "9091", protocol: TCP}]
    - fromEntities: [world]
      toPorts:
        - ports: [{port: "51413", protocol: TCP}, {port: "51413", protocol: UDP}]
