apiVersion: v1
kind: Service
metadata:
  name: transmission-web
spec:
  selector: {app: transmission}
  ports:
    - {name: web, port: 9091, targetPort: web}
---
# Incoming BitTorrent peers; WAN 51413 is forwarded to this address.
apiVersion: v1
kind: Service
metadata:
  name: transmission-peer
  annotations:
    lbipam.cilium.io/ips: 10.20.8.245
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app: transmission}
  ports:
    - {name: peer-tcp, port: 51413, targetPort: peer-tcp, protocol: TCP}
    - {name: peer-udp, port: 51413, targetPort: peer-udp, protocol: UDP}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmission
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [dl.private.home.lobor.dev]
  rules:
    - host: dl.private.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: transmission-web, port: {name: web}}}}
