# UniFi Network Application with its MongoDB in the same pod (Mongo listens on localhost only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: unifi}
  template:
    metadata:
      labels: {app: unifi}
    spec:
      automountServiceAccountToken: false
      securityContext:                      # both images start as root and drop privileges themselves (s6 / gosu)
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongo
          image: mongo:7.0.43
          args: [--bind_ip, 127.0.0.1, --auth]
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: db, mountPath: /data/db}
        - name: unifi
          image: lscr.io/linuxserver/unifi-network-application:10.6.106
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: Europe/Kyiv}
            - {name: MONGO_HOST, value: 127.0.0.1}
            - {name: MONGO_PORT, value: "27017"}
            - {name: MONGO_USER, value: unifi}
            - {name: MONGO_DBNAME, value: unifi}
            - {name: MONGO_AUTHSOURCE, value: admin}
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef: {name: unifi-mongo, key: password}
          ports:
            - {name: ui, containerPort: 8443}
            - {name: inform, containerPort: 8080}
            - {name: stun, containerPort: 3478, protocol: UDP}
          readinessProbe:
            tcpSocket: {port: ui}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - name: db
          persistentVolumeClaim: {claimName: unifi-db}
        - name: config
          persistentVolumeClaim: {claimName: unifi-config}
