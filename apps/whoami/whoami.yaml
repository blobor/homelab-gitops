# Ingress smoke test: echoes request headers through both Traefik instances.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          args: [--port=8080]
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector: {app: whoami}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami-internal
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [whoami.private.home.lobor.dev]
  rules:
    - host: whoami.private.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {name: http}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami-public
spec:
  ingressClassName: traefik-public
  tls:
    - hosts: [whoami.home.lobor.dev]
  rules:
    - host: whoami.home.lobor.dev
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: whoami, port: {name: http}}}}
