# ArgoCD (argo/argo-cd chart) with KSOPS in the repo-server.
# Applied by hand once: helm install argo-cd argo/argo-cd -n argocd -f bootstrap/argocd-values.yaml
fullnameOverride: argocd
global:
  domain: argo.private.home.lobor.dev
server:
  ingress:
    enabled: true
    ingressClassName: traefik-internal
    extraTls:
      - hosts: [argo.private.home.lobor.dev]   # wildcard certificate from the Traefik TLSStore
dex:
  enabled: false
configs:
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"   # required for ksops
  params:
    server.insecure: true            # TLS terminates at traefik-internal
repoServer:
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age         # kubectl -n argocd create secret generic sops-age --from-file=keys.txt=…
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops-age
      name: sops-age
      readOnly: true
