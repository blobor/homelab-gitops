apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailnet-backends
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blobor/homelab-gitops.git
    targetRevision: main
    path: apps/tailnet-backends
  destination:
    server: https://kubernetes.default.svc
    namespace: tailnet-backends
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:            # the Tailscale operator points externalName at its egress proxy
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/externalName
