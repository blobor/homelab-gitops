apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec-db
spec:
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
  smartShutdownTimeout: 15        # clients with connection pools never disconnect; then fast shutdown
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-standard-trixie
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
  postgresql:
    parameters:
      max_slot_wal_keep_size: 2GB   # a replica that is down cannot fill the primary's volume
    synchronous:
      method: any
      number: 1
      dataDurability: preferred     # with one instance down, writes go on without a sync standby
  storage:
    storageClass: local
    size: 4Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
