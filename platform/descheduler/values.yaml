kind: CronJob
schedule: "*/10 * * * *"
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 128Mi}

podSecurityContext:
  seccompProfile: {type: RuntimeDefault}

deschedulerPolicy:
  maxNoOfPodsToEvictPerNode: 5
  profiles:
    - name: failed-pods
      pluginConfig:
        - name: DefaultEvictor
        - name: RemoveFailedPods
          args:
            # Kubelet fails GPU pods after a node reboot, before the GPU plugin registers.
            reasons: [UnexpectedAdmissionError]
            excludeOwnerKinds: [Job]
      plugins:
        deschedule:
          enabled: [RemoveFailedPods]
    - name: balance
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            podProtections:
              defaultDisabled: [PodsWithLocalStorage]
              extraEnabled: [PodsWithPVC]
              config:
                PodsWithPVC:
                  # Local LVM volumes are bound to one node, so these pods cannot move.
                  protectedStorageClasses:
                    - name: local
        - name: RemoveDuplicates
        - name: LowNodeUtilization
          args:
            useDeviationThresholds: true
            thresholds: {cpu: 10, memory: 10, pods: 10}
            targetThresholds: {cpu: 10, memory: 10, pods: 10}
      plugins:
        balance:
          enabled: [RemoveDuplicates, LowNodeUtilization]
    - name: crowdsec-agent
      pluginConfig:
        - name: DefaultEvictor
          args:
            podProtections:
              defaultDisabled: [DaemonSetPods, PodsWithLocalStorage]
        - name: RemovePodsHavingTooManyRestarts
          args:
            # After a node reboot the agent pod keeps its name, and its init container fails to
            # register again: "user already exist" (crowdsecurity/helm-charts#252).
            # A new pod gets a new name and registers.
            podRestartThreshold: 3
            includingInitContainers: true
            states: [CrashLoopBackOff]
            namespaces: {include: [crowdsec]}
            labelSelector: {matchLabels: {k8s-app: crowdsec, type: agent}}
      plugins:
        deschedule:
          enabled: [RemovePodsHavingTooManyRestarts]
