# Released PVs of class `local` hold an LV on the node until someone deletes them.
# Day 0: mark the PV. After 14 days: set reclaimPolicy Delete, so the provisioner removes the PV and the LV.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: released-pv-cleanup
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: released-pv-cleanup
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: released-pv-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: released-pv-cleanup
subjects:
  - kind: ServiceAccount
    name: released-pv-cleanup
    namespace: openebs
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: released-pv-cleanup
spec:
  schedule: "0 4 * * *"
  timeZone: Europe/Kyiv
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: released-pv-cleanup
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: cleanup
              image: alpine/k8s:1.37.1
              env:
                - {name: HOME, value: /tmp}
                - {name: KEEP_DAYS, value: "14"}
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  now=$(date +%s)
                  kubectl get pv -o json | jq -r '
                    .items[]
                    | select(.spec.storageClassName == "local" and .status.phase == "Released")
                    | [.metadata.name, (.metadata.annotations["storage.lobor.dev/released-at"] // "")]
                    | @tsv' |
                  while IFS=$'\t' read -r pv since; do
                    if [[ -z $since ]]; then
                      kubectl annotate pv "$pv" "storage.lobor.dev/released-at=$now"
                    elif (( now - since > KEEP_DAYS * 86400 )); then
                      kubectl patch pv "$pv" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'
                    fi
                  done
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: tmp, emptyDir: {}}
