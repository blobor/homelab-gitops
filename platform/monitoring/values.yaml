fullnameOverride: vm

victoria-metrics-operator:
  crds:
    cleanup:
      enabled: false
  # Helm-generated webhook cert changes on every render (endless OutOfSync in ArgoCD).
  admissionWebhooks:
    enabled: false

# Two VMSingle (a, b) on local storage, one per worker: manifests/vmsingle.yaml.
# vmagent writes to both; Grafana and vmalert read through the Service vmsingle (either pod).
vmsingle:
  enabled: false

external:
  vm:
    read:
      url: http://vmsingle.monitoring.svc:8428
    write:
      url: http://vmsingle-a.monitoring.svc:8428/api/v1/write

vmagent:
  additionalRemoteWrites:
    - url: http://vmsingle-b.monitoring.svc:8428/api/v1/write
  spec:
    externalLabels:
      cluster: springfield

vmalert:
  remoteWriteVMAgent: true   # recording rules reach both VMSingle

# These default to vmsingle.enabled.
defaultRules:
  sources:
    vmhealth:
      enabled: true
    vmsingle:
      enabled: true
defaultDashboards:
  sources:
    victoriametrics-single-node:
      enabled: true

# Only the Watchdog leaves the cluster (healthchecks.io dead-man switch); every other alert stays in Grafana / vmalert UI.
alertmanager:
  spec:
    replicaCount: 2            # gossip: silences and nflog are shared
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmalertmanager
    secrets:
      - alertmanager-secrets   # mounted at /etc/vm/secrets/alertmanager-secrets/
    storage:                   # silences and nflog survive pod restarts
      volumeClaimTemplate:
        spec:
          storageClassName: local
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
  config:
    route:
      receiver: blackhole
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: healthchecks
          matchers: [alertname="Watchdog"]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
    receivers:
      - name: blackhole
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/vm/secrets/alertmanager-secrets/healthchecks-url
            send_resolved: false
            payload:                       # short body: healthchecks.io shows it in Telegram as «Last Ping Body»
              message: 'Watchdog {{ .Status }}, alerting pipeline OK'   # no ": " — the rendered value is parsed as YAML

grafana:
  testFramework:
    enabled: false
  grafana.ini:
    server:
      root_url: https://grafana.private.home.lobor.dev
  ingress:
    enabled: true
    ingressClassName: traefik-internal
    hosts: [grafana.private.home.lobor.dev]
    tls:
      - hosts: [grafana.private.home.lobor.dev]   # wildcard certificate from the Traefik TLSStore
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

# Talos: controller-manager and scheduler serve self-signed certs.
kubeControllerManager:
  vmScrape:
    spec:
      endpoints:
        - port: http-metrics
          scheme: https
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            insecureSkipVerify: true

kubeScheduler:
  vmScrape:
    spec:
      endpoints:
        - port: http-metrics
          scheme: https
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            insecureSkipVerify: true

# Talos: etcd runs on the host; scraped via VMStaticScrape in manifests/
# (ArgoCD excludes Endpoints, so the chart's headless service never gets a target).
kubeEtcd:
  service:
    enabled: false
  vmScrape:
    enabled: false
