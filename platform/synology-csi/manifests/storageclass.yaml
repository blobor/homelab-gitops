apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-iscsi
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: csi.san.synology.com
parameters:
  dsm: 10.20.30.200
  location: /volume1
  protocol: iscsi
  fsType: ext4
# Stop writes on the first ext4 error after a lost iSCSI session; the default (continue) can corrupt the filesystem.
mountOptions:
  - errors=remount-ro
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
