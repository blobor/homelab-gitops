# synology-csi (SynologyOpenSource/synology-csi deploy/helm @ v1.3.1)
images:
  plugin:
    # renovate: datasource=docker depName=synology/synology-csi
    tag: v1.3.1
clientInfoSecret:
  create: false
  name: client-info-secret          # from manifests/client-info.sops.yaml (KSOPS)
node:
  extraArgs:
    - --iscsiadm-path=/usr/local/sbin/iscsiadm   # Talos: no /usr/bin/env on the host, iscsi-tools extension path
# The chart template has no mountOptions; StorageClass synology-iscsi is in manifests/.
storageClasses:
  synology-iscsi-storage:
    disabled: true
volumeSnapshotClasses: {}
