# OAuth credentials come from Secret operator-oauth (KSOPS, manifests/).
operatorConfig:
  hostname: springfield-operator
  defaultTags:
    - tag:springfield-operator

proxyConfig:
  defaultTags: tag:springfield-proxy

# Services are exposed via loadBalancerClass: tailscale; no Tailscale IngressClass needed.
ingressClass:
  enabled: false
