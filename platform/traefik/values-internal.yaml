# Internal entry point: LAN + tailnet, LB 10.20.8.241. Serves only IngressClass traefik-internal.
fullnameOverride: traefik-internal

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-internal

providers:
  kubernetesCRD:
    ingressClass: traefik-internal
    defaultTLSResourcesNamespace: traefik
  kubernetesIngress:
    ingressClass: traefik-internal
    allowExternalNameServices: true         # Tailscale egress proxies are ExternalName Services

core:
  strictTLSOptions: true

additionalArguments:
  - --providers.kubernetescrd.safeNaming=false   # keep router names; the chart sets the flag only when true

ports:
  web:
    expose:
      default: true
      tailnet: false
    http:
      aliasHeadersStrategy: delete          # drop X_Foo / X.Foo aliases of the headers Traefik manages
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    expose:
      default: true
      tailnet: true
    http:
      aliasHeadersStrategy: delete
    transport:
      respondingTimeouts:
        readTimeout: 0

deployment:
  replicas: 2

# Honor taints: else the control plane counts as an empty domain and the rollout surge pod never schedules.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-internal-traefik

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

service:
  annotations:
    lbipam.cilium.io/ips: 10.20.8.241
  additionalServices:
    tailnet:                                # exposed in the tailnet by the Tailscale operator as springfield-ingress
      spec:
        type: LoadBalancer
        loadBalancerClass: tailscale
      annotations:
        tailscale.com/hostname: springfield-ingress
