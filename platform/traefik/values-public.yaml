# Public entry point: Cloudflare → MikroTik dst-nat 443 → LB 10.20.8.240. Serves only IngressClass traefik-public.
fullnameOverride: traefik-public

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-public

providers:
  kubernetesCRD:
    ingressClass: traefik-public
    defaultTLSResourcesNamespace: traefik   # TLSStore "default" with the wildcard certs
  kubernetesIngress:
    ingressClass: traefik-public
    allowExternalNameServices: true         # Tailscale egress proxies are ExternalName Services

core:
  strictTLSOptions: true

additionalArguments:
  - --providers.kubernetescrd.safeNaming=false   # keep router names; the chart sets the flag only when true

accessLog:                                  # read by the CrowdSec agent from the container log
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop                     # no cookies or tokens in the log

experimental:
  plugins:
    crowdsec-bouncer:                       # used by the Middleware traefik/crowdsec-bouncer
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      # renovate: datasource=github-releases depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1

deployment:
  additionalVolumes:
    - name: crowdsec-bouncer
      secret:
        secretName: crowdsec-bouncer

additionalVolumeMounts:
  - name: crowdsec-bouncer
    mountPath: /etc/traefik/crowdsec        # LAPI key for the bouncer plugin
    readOnly: true

ports:
  web:
    expose:
      default: false                        # port 80 closed — Cloudflare redirects to HTTPS
    http:
      aliasHeadersStrategy: delete          # drop X_Foo / X.Foo aliases of the headers Traefik manages
  websecure:
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - traefik-crowdsec-bouncer@kubernetescrd   # every public route; namespace-name@provider

extraObjects:
  - |
    # Blocks IPs with a CrowdSec decision. Attached to the websecure entrypoint above.
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: crowdsec-bouncer
      namespace: traefik
    spec:
      plugin:
        crowdsec-bouncer:
          enabled: true
          crowdsecMode: stream                  # local cache of bans, refreshed from LAPI every 60 s
          crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
          crowdsecLapiKeyFile: /etc/traefik/crowdsec/key
          updateMaxFailure: -1                  # LAPI down: keep serving with the last cache, never block all
          streamStartupBlock: false             # do not hold Traefik start until LAPI answers
          forwardedHeadersTrustedIPs: {{ .Values.ports.websecure.forwardedHeaders.trustedIPs | toJson }}   # values-cloudflare.yaml

service:
  annotations:
    lbipam.cilium.io/ips: 10.20.8.240
  spec:
    externalTrafficPolicy: Local            # keep the Cloudflare source IP for trustedIPs
