# Control plane only.
# Kubernetes API VIP (talosctl always talks to node IPs, never the VIP).
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.20.8.100
link: ens18
---
# No kube-proxy — Cilium kube-proxy replacement. KubeProxyConfig is a control-plane-only document.
# Talos 1.14: deleting it falls back to the default (enabled) — disable explicitly.
# enabled=false only affects bootstrap manifests; an already-running kube-proxy DaemonSet must be deleted by hand.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# Lets pods in etcd-backup take etcd snapshots via the Talos API (and nothing else).
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:etcd:backup
allowedKubernetesNamespaces:
  - etcd-backup
---
# Metrics for the monitoring stack (controller-manager :10257, scheduler :10259 — HTTPS + token).
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# etcd metrics on :2381 (plain HTTP).
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
